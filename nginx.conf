server {
    listen 80;
    server_name hieunamson.id.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hieunamson.id.vn;

    ssl_certificate /etc/letsencrypt/live/hieunamson.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hieunamson.id.vn/privkey.pem;

    location /static/ {
        alias /app/static/;
    }

    location / {
        proxy_pass http://web:8000;
    }
}
