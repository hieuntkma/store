{% load static %}
<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<script>
    Swal.fire({
        icon: 'warning',
        title: 'Thông báo',
        text: '{{ alert_message }}',
        confirmButtonText: 'Quay lại'
    }).then(() => {
        window.location.href = "{{ redirect_url }}";
    });
</script>
</body>
</html>
