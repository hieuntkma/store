<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cool Organic - Home</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
    }
    .search-box {
      display: flex;
      align-items: center;
      position: relative;
    }
    .search-box i {
      cursor: pointer;
    }
    .search-input {
      display: none;
      width: 180px;
      margin-left: 10px;
    }
    .search-box:hover .search-input {
      display: block;
    }
    .badge {
      font-size: 0.7rem;
    }
    .hero {
      background: url('/mnt/data/banner1.png') no-repeat center center;
      background-size: cover;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #5e8133;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: bold;
    }
    .hero h4 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      color: #888;
    }
  </style>
</head>
<body>

<header class="bg-white shadow-sm">
  <div class="container py-2">
    <div class="d-flex align-items-center justify-content-between">
      <a href="/" class="navbar-brand d-flex align-items-center">
        <img src="/mnt/data/logo.png" alt="Cool Organic Logo" height="50">
      </a>
      <nav class="d-none d-lg-block">
        <ul class="nav">
          <li class="nav-item"><a class="nav-link text-success fw-bold" href="/">Trang chủ</a></li>
          <li class="nav-item"><a class="nav-link" href="/product/shop-detail/">Chi tiết sản phẩm</a></li>
          <li class="nav-item"><a class="nav-link" href="/gioi-thieu">Giới thiệu</a></li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Sản phẩm</a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="/rau-cu">Rau củ</a></li>
              <li><a class="dropdown-item" href="/hoa-qua">Hoa quả</a></li>
              <li><a class="dropdown-item" href="/hai-san">Hải sản</a></li>
              <li><a class="dropdown-item" href="/cac-loai-hat">Các loại hạt</a></li>
              <li><a class="dropdown-item" href="/thuc-pham-tuoi-song">Thực phẩm tươi sống</a></li>
            </ul>
          </li>
          <li class="nav-item"><a class="nav-link" href="/tin-tuc">Tin tức</a></li>
          <li class="nav-item"><a class="nav-link" href="/lien-he">Liên hệ</a></li>
        </ul>
      </nav>
      <div class="d-flex align-items-center gap-3">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" placeholder="Tìm kiếm..." class="form-control search-input">
        </div>
        <div class="dropdown">
          <i class="fas fa-user dropdown-toggle" role="button" data-bs-toggle="dropdown"></i>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/account/login">Đăng nhập</a></li>
            <li><a class="dropdown-item" href="/account/register">Đăng ký</a></li>
          </ul>
        </div>
        <a href="/cart" class="position-relative">
          <i class="fas fa-shopping-basket"></i>
          <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success">0</span>
        </a>
      </div>
      <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse" data-bs-target="#mobileMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </div>
  <div class="collapse d-lg-none" id="mobileMenu">
    <div class="container">
      <ul class="nav flex-column py-2">
        <li class="nav-item"><a class="nav-link" href="/">Trang chủ</a></li>
        <li class="nav-item"><a class="nav-link" href="/gioi-thieu">Giới thiệu</a></li>
        <li class="nav-item"><a class="nav-link" href="/collections/all">Sản phẩm</a></li>
        <li class="nav-item"><a class="nav-link" href="/tin-tuc">Tin tức</a></li>
        <li class="nav-item"><a class="nav-link" href="/lien-he">Liên hệ</a></li>
      </ul>
    </div>
  </div>
</header>

<!-- Hero Section -->
<section class="hero">
  <div>
    <h4>Thực phẩm bổ dưỡng</h4>
    <h1>Cool Organic</h1>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
