services:

  db:
    image: postgres:latest
    container_name: hnt-db
    env_file:
      - .env
    ports:
      - "5433:5432"
      # - /python/postgres/data/todoapp:/var/lib/postgresql/data
  web:
    image: django-docker
    container_name: hnt-web
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 store.wsgi:application
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  nginx:
    image: nginx:latest
    container_name: hnt-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./static:/app/static
      - ./media:/app/media
    depends_on:
      - web